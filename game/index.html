<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGC Command v2 · Isometric Voxel &amp; ASCII Edition</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">◎ SGC COMMAND</div><div id="chap"></div><div id="res"></div><div id="round"></div>
<button id="clipboard-btn" class="small" title="Hammonds Klemmbrett &amp; Büro (Personalübersicht)">📋</button>
<button id="gfx-btn" class="small" title="Grafikmodus wechseln: Pixel-Voxel / ASCII-3D / 2D (Taste V)">🖥 PIXEL</button>
<button id="strudel-btn" class="small" title="Strudel Core Sound-Engine &amp; Live-Coding">🎵</button>
<button id="help" class="small" title="Anleitung">❓</button>
<button id="sound" class="small" title="Sound an/aus">🔊</button>
<button id="go">▶ Tag beenden</button><button id="reset" class="small">⟲</button></header>
<nav>
<button data-tab="base">🏗 Basis</button>
<button data-tab="map">🗺 Sternenkarte</button>
<button data-tab="colonies">🪐 Kolonien</button>
<button data-tab="roster">👥 Roster &amp; Arsenal</button>
<button data-tab="log">📜 Protokoll</button>
</nav>
<main>
<div class="pane" id="pane-base"><div class="split"><div class="base-canvas-scroll"><canvas id="base-cv" width="720" height="1134"></canvas></div><aside id="base-side"></aside></div></div>
<div class="pane" id="pane-map"><div class="split"><canvas id="map-cv" width="960" height="540"></canvas><aside id="map-side"></aside></div></div>
<div class="pane" id="pane-colonies"><div class="split"><canvas id="colony-cv" width="960" height="540"></canvas><aside id="colony-side"></aside></div></div>
<div class="pane" id="pane-roster"><div id="roster-body" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px"></div></div>
<div class="pane" id="pane-log"><div id="log-body"></div></div>
</main>
<!-- Gateroom-Overlay (Übergang) -->
<div id="gate-overlay" style="display:none;position:fixed;inset:0;background:#000;z-index:15;align-items:center;justify-content:center;cursor:pointer">
 <button id="gate-skip" class="gate-skip-btn" style="position:absolute;top:18px;right:22px;z-index:9;background:#0f172a;border:1px solid #38bdf8;color:#e0f2fe;font-family:monospace;font-weight:bold;padding:8px 16px;border-radius:4px;cursor:pointer;box-shadow:0 0 12px rgba(56,189,248,.35)">Überspringen <span>ESC / Klick</span></button>
 <canvas id="gate-cv" width="960" height="540" style="max-width:95vw;height:auto"></canvas>
</div>
<div id="intro-overlay" style="display:none">
 <canvas id="intro-cv" width="1280" height="720" aria-label="Cinematic Stargate opening"></canvas>
 <button id="intro-audio">🔊 Ton aktivieren</button>
 <button id="intro-skip">Überspringen <span>ESC</span></button>
</div>
<div id="story-dialogue" role="dialog" aria-modal="true" aria-live="polite"></div>
<!-- Combat-Overlay (Canvas oben flex:1, Jagged-Alliance UI unten angedockt) -->
<div id="combat-overlay" style="display:none;position:fixed;inset:0;background:#000;z-index:20;flex-direction:column;align-items:stretch;justify-content:stretch;overflow:hidden">
 <div class="combat-viewport-wrap" style="flex:1;position:relative;overflow:hidden;width:100%;min-height:0">
  <canvas id="combat-cv" width="960" height="720" aria-label="Taktische Einsatzkarte" style="touch-action:none;cursor:grab;width:100%;height:100%;display:block"></canvas>
  <canvas id="combat-minimap" width="256" height="192" aria-label="Minimap: anklicken, um die Kartenansicht zu verschieben"></canvas>
  <button id="combat-end" style="display:none;padding:10px 24px;font-size:16px">Weiter</button>
 </div>
 <div id="combat-ui" style="display:none;flex:0 0 auto"></div>
</div>
<div id="menu" style="display:none">
 <div class="menu-box">
  <div class="menu-title">◎ SGC COMMAND</div>
  <div class="menu-sub">PAUSE &amp; SYSTEM-KONFIGURATION</div>
  <button class="menu-btn" onclick="hideMenu()">▶ Weiterspielen</button>
  <div class="menu-diff"><span>🖥 Grafik-Engine</span><select id="menu-gfx" onchange="act(setGfxMode(this.value))"><option value="pixel">Isometrisch Voxel (Pixel-Art)</option><option value="ascii">ASCII-3D (asciiid / asciicker)</option><option value="topdown">Klassisch 2D Top-Down</option></select></div>
  <div class="menu-diff"><span>⚔ Schwierigkeit</span><select id="menu-diff" onchange="act(setDifficulty(this.value))"><option value="easy">Leicht</option><option value="normal">Normal</option><option value="hard">Hart</option></select></div>
  <button class="menu-btn" onclick="hideMenu();showStrudelModal()">🎵 Strudel Sound-Engine &amp; Live-Code</button>
  <button class="menu-btn" onclick="hideMenu();showKeybindModal()">⌨ Tastatur &amp; Tastenbelegung</button>
  <button class="menu-btn" onclick="hideMenu();showClipboardModal()">📋 Hammonds Klemmbrett (Personal)</button>
  <button class="menu-btn" onclick="showHelp()">📖 Anleitung</button>
  <button class="menu-btn" onclick="replayOpeningCinematic()">🎬 Intro erneut ansehen</button>
  <button class="menu-btn" id="menu-sound" onclick="toggleSound()">🔊 Sound an/aus</button>
  <button class="menu-btn" onclick="resetGame(false)">⟲ Neues Spiel</button>
  <button class="menu-btn dim" onclick="resetGame(true)">⏏ Zurücksetzen (ohne Frage)</button>
  <div class="menu-foot">ESC = Menü · V = Pixel/ASCII · Q/E = Kamera · TAB = Nächstes Mitglied</div>
 </div>
</div>
<div id="modal"></div><div id="over"></div><div id="toast"></div>
<script src="vendor/strudel-web.js"></script><script src="switch-angel.js"></script><script src="midi-data.js"></script><script src="sound.js"></script><script src="midi.js"></script><script src="art.js"></script><script src="art2.js"></script><script src="../content/quests.js"></script><script src="../content/intros.js"></script><script src="../content/scenes.js"></script><script src="engine.js"></script><script src="iso.js"></script><script src="combat.js"></script><script src="base.js"></script><script src="cinematic.js"></script><script src="ui.js"></script></body></html>
